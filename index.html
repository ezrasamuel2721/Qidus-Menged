<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ቅዱስ መንገድ | Qidus Menged</title>

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Arial,"Noto Sans Ethiopic",sans-serif;
      background:#f7f4ed;
      color:#222;
    }

    header{
      background:#5b3a20;
      color:#fff;
      padding:18px 20px;
      position:sticky;
      top:0;
      z-index:10;
      box-shadow:0 2px 8px #0002;
    }

    .header{
      max-width:1100px;
      margin:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
    }

    .brand{
      font-size:25px;
      font-weight:bold;
    }

    .brand small{
      display:block;
      font-size:12px;
      opacity:.8;
      margin-top:3px;
    }

    nav{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    button{
      border:0;
      border-radius:9px;
      padding:10px 14px;
      cursor:pointer;
      font-size:14px;
    }

    nav button{
      background:#ffffff18;
      color:#fff;
    }

    nav button:hover{
      background:#ffffff30;
    }

    main{
      max-width:1100px;
      margin:auto;
      padding:30px 18px 60px;
    }

    .panel{
      display:none;
    }

    .panel.active{
      display:block;
    }

    .hero{
      text-align:center;
      padding:30px 10px;
    }

    .hero h1{
      margin:0 0 10px;
      font-size:36px;
      color:#5b3a20;
    }

    .hero p{
      color:#666;
      margin-bottom:24px;
    }

    .search{
      max-width:700px;
      margin:auto;
      display:flex;
      gap:8px;
    }

    .search input{
      flex:1;
      padding:15px;
      border:1px solid #ddd;
      border-radius:10px;
      font-size:16px;
      outline:none;
    }

    .search button{
      background:#5b3a20;
      color:#fff;
      padding:0 22px;
    }

    .filters{
      display:flex;
      justify-content:center;
      gap:8px;
      margin:20px 0;
      flex-wrap:wrap;
    }

    .filter{
      background:#fff;
      border:1px solid #ddd;
      color:#5b3a20;
    }
