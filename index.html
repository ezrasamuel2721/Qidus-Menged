<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ቅዱስ መንገድ | Qidus Menged</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,"Noto Sans Ethiopic",sans-serif;
  background:#f5f7f9;
  color:#222;
  line-height:1.7;
}

header{
  background:linear-gradient(135deg,#173f35,#276b55);
  color:white;
  padding:22px 15px 30px;
  text-align:center;
}

.logo{
  font-size:30px;
  font-weight:bold;
}

.subtitle{
  margin-top:5px;
  opacity:.9;
}

.search-area{
  max-width:850px;
  margin:22px auto 0;
}

.search-box{
  display:flex;
  background:white;
  border-radius:14px;
  padding:6px;
  box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.search-box input{
  flex:1;
  border:0;
  outline:none;
  padding:14px;
  font-size:16px;
  color:#222;
}

.search-box button{
  border:0;
  border-radius:10px;
  padding:0 22px;
  background:#d99b2b;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

nav{
  background:white;
  display:flex;
  gap:8px;
  padding:10px;
  overflow-x:auto;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

nav button{
  border:0;
  background:#eef3f1;
  color:#173f35;
  padding:10px 14px;
  border-radius:20px;
  white-space:nowrap;
  cursor:pointer;
  font-weight:bold;
}

nav button:hover{
  background:#dcebe5;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px 15px 50px;
}

.section-title{
  margin-bottom:15px;
  color:#173f35;
}

.search-status{
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.results{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:18px;
}

.card{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  box-shadow:0 8px 22px rgba(0,0,0,.12);
}

.card img{
  width:100%;
  height:190px;
  object-fit:cover;
  background:#ddd;
}

.card-content{
  padding:17px;
}

.type{
  display:inline-block;
  background:#e9f3ee;
  color:#176044;
  border-radius:20px;
  padding:4px 10px;
  font-size:13px;
  margin-bottom:8px;
}

.card h3{
  color:#173f35;
  margin-bottom:5px;
}

.location{
  color:#666;
  font-size:14px;
  margin-bottom:10px;
}

.description{
  font-size:14px;
  color:#555;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:14px;
}

.actions button,
.actions a{
  border:0;
  text-decoration:none;
  background:#173f35;
  color:white;
  padding:8px 11px;
  border-radius:8px;
  cursor:pointer;
  font-size:13px;
}

.actions .favorite{
  background:#d99b2b;
}

.details{
  display:none;
  background:white;
  padding:25px;
  border-radius:16px;
  margin-top:25px;
  box-shadow:0 3px 15px rgba(0,0,0,.1);
}

.details img{
  width:100%;
  max-height:400px;
  object-fit:cover;
  border-radius:12px;
  margin:15px 0;
}

.details h2{
  color:#173f35;
  margin-bottom:8px;
}

.detail-row{
  margin:8px 0;
}

.detail-label{
  font-weight:bold;
  color:#173f35;
}

.close-btn{
  float:right;
  border:0;
  background:#eee;
  padding:7px 12px;
  border-radius:7px;
  cursor:pointer;
}

.empty{
  text-align:center;
  background:white;
  padding:35px 20px;
  border-radius:15px;
  color:#777;
  grid-column:1/-1;
}

.dashboard{
  margin-top:30px;
  background:white;
  padding:22px;
  border-radius:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
  margin-top:15px;
}

.form-grid input,
.form-grid textarea,
.form-grid select{
  width:100%;
  padding:11px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:14px;
}

.form-grid textarea{
  min-height:100px;
  resize:vertical;
}

.full{
  grid-column:1/-1;
}

.add-btn{
  margin-top:15px;
  background:#173f35;
  color:white;
  border:0;
  padding:12px 20px;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold;
}

.add-btn:hover{
  background:#276b55;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;
  margin-bottom:20px;
}

.stat{
  background:#f4f7f5;
  padding:15px;
  border-radius:12px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:25px;
  color:#173f35;
}

.stat span{
  font-size:13px;
  color:#666;
}

.dashboard-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:15px;
}

.dashboard-actions button{
  border:0;
  background:#173f35;
  color:white;
  padding:10px 14px;
  border-radius:8px;
  cursor:pointer;
}

.dashboard-actions .danger{
  background:#a33a3a;
}

.notice{
  display:none;
  position:fixed;
  left:15px;
  right:15px;
  bottom:20px;
  max-width:500px;
  margin:auto;
  background:#173f35;
  color:white;
  padding:14px 18px;
  border-radius:10px;
  text-align:center;
  box-shadow:0 5px 20px rgba(0,0,0,.2);
  z-index:100;
}

footer{
  background:#173f35;
  color:white;
  text-align:center;
  padding:25px 15px;
  margin-top:30px;
}

footer p{
  opacity:.9;
}

@media(max-width:600px){

  .logo{
    font-size:24px;
  }

  .search-box{
    flex-direction:column;
    gap:5px;
  }

  .search-box button{
    padding:12px;
  }

  .card img{
    height:170px;
  }

  .details{
    padding:18px;
  }

  nav{
    scrollbar-width:none;
  }

  nav::-webkit-scrollbar{
    display:none;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">✝ ቅዱስ መንገድ</div>

  <div class="subtitle">
    የገዳማትና የአድባራት መረጃ መፈለጊያ
  </div>

  <div class="search-area">

    <div class="search-box">

      <input
        id="searchInput"
        type="text"
        placeholder="ገዳማትንና አድባራትን ፈልግ..."
        onkeydown="if(event.key==='Enter') searchPlaces()"
      >

      <button onclick="searchPlaces()">
        🔎 ፈልግ
      </button>

    </div>

  </div>

</header>


<nav>

  <button onclick="showAll()">
    ሁሉንም አሳይ
  </button>

  <button onclick="filterType('ገዳም')">
    ገዳማት
  </button>

  <button onclick="filterType('አድባራት')">
    አድባራት
  </button>

  <button onclick="showFavorites()">
    ❤️ የተወደዱ
  </button>

  <button onclick="goDashboard()">
    ⚙️ Dashboard
  </button>

</nav>

  <h2 class="section-title">
    🔎 የፍለጋ ውጤቶች
  </h2>

  <div id="status" class="search-status">

  </div>
